<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sprintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="driftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)" rx="12"/>
  <rect width="400" height="400" fill="url(#grid)" rx="12"/>

  <!-- Horizontal strata lines -->
  <line x1="40" y1="80" x2="360" y2="80" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="160" x2="360" y2="160" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="240" x2="360" y2="240" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="320" x2="360" y2="320" stroke="#334155" stroke-width="1" opacity="0.3"/>

  <!-- Sprint waveform -->
  <path d="M 40 200 L 70 200 L 80 140 L 90 260 L 100 180 L 110 220 L 120 200 L 150 200 L 160 120 L 170 280 L 180 160 L 190 240 L 200 200" fill="none" stroke="url(#sprintGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Drift waveform -->
  <path d="M 200 200 Q 220 185 240 200 Q 260 215 280 200 Q 300 190 320 200 Q 340 205 360 200" fill="none" stroke="url(#driftGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Nodes -->
  <circle cx="80" cy="200" r="4" fill="#0ea5e9" filter="url(#glow)"/>
  <circle cx="160" cy="200" r="4" fill="#0ea5e9" opacity="0.8"/>
  <circle cx="200" cy="200" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="280" cy="200" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="360" cy="200" r="2" fill="#38bdf8" opacity="0.3"/>

  <!-- Corner brackets -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
  <path d="M 360 60 L 360 40 L 340 40" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
  <path d="M 40 340 L 40 360 L 60 360" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
  <path d="M 360 340 L 360 360 L 340 360" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
</svg>
