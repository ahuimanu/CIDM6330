[project]
name = "cidm6330"
version = "0.1.0"
description = "CIDM 6330 - Software Systems Development course materials"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8.0"]

# =============================================================================
# Ruff - Linting and Formatting (replaces black, isort, flake8)
# https://docs.astral.sh/ruff/
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    "PLR0913", # Too many arguments - OOP demos often have many params
    "PLR2004", # Magic value comparison - acceptable in demos
]

[tool.ruff.lint.isort]
known-first-party = ["cidm6330"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# ty - Type Checking (Astral's type checker)
# https://docs.astral.sh/ty/
# =============================================================================

[tool.ty.environment]
python-version = "3.13"
